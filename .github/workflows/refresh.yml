name: Refresh Cannes data

on:
  schedule:
    # Times are UTC (GitHub cron is always UTC). Cannes runs on CEST = UTC+2.
    - cron: "0 20 * * *"   # 22:00 CEST — after the day's talks have wrapped + that evening's awards show
    - cron: "0 6 * * *"    # 08:00 CEST — catches overnight trade-press write-ups before the next day starts
  workflow_dispatch: {}   # lets you trigger a manual refresh from the Actions tab

permissions:
  contents: write          # needed to commit data.json back to the repo

concurrency:
  group: cannes-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate data.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/update.mjs

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain data.json)" ]]; then
            git config user.name  "cannes-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data.json
            git commit -m "data: refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No changes to commit."
          fi
